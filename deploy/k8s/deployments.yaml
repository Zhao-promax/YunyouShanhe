# 云游山河 · K8s 部署清单（7 个服务）
# 注意：中间件地址当前指向 VM(192.168.179.248)，部署到阿里云 ACK 前改为阿里云服务内网地址。

# ==================== 网关 ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yunyou-gateway
  labels: { app: yunyou-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yunyou-gateway }
  template:
    metadata:
      labels: { app: yunyou-gateway }
    spec:
      containers:
        - name: yunyou-gateway
          image: yunyou-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR, value: "192.168.179.248:8848" }
            - { name: JWT_SECRET, value: "yunyou-shanhe-jwt-secret-dev-only-change-in-prod-0123456789" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: yunyou-gateway
spec:
  type: LoadBalancer
  selector: { app: yunyou-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]

# ==================== 用户服务 ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yunyou-user-service
  labels: { app: yunyou-user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yunyou-user-service }
  template:
    metadata:
      labels: { app: yunyou-user-service }
    spec:
      containers:
        - name: yunyou-user-service
          image: yunyou-user-service:1.0.0
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR, value: "192.168.179.248:8848" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://192.168.179.248:3306/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "root" }
            - { name: SPRING_DATASOURCE_PASSWORD, value: "root" }
            - { name: SPRING_DATA_REDIS_HOST, value: "192.168.179.248" }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
            - { name: JWT_SECRET, value: "yunyou-shanhe-jwt-secret-dev-only-change-in-prod-0123456789" }
            - { name: AES_SECRET, value: "yunyou-shanhe-aes-secret-dev-only-change-in-prod-0123456789" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: yunyou-user-service
spec:
  type: ClusterIP
  selector: { app: yunyou-user-service }
  ports: [{ port: 8081, targetPort: 8081 }]

