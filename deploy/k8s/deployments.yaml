# 云游山河 · 7 个服务 Deployment + Service
# 依赖：先 apply configmap.yaml / secret.yaml / rabbitmq.yaml
# 中间件地址在 configmap.yaml 中配置（内网地址）

# ==================== 网关 ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yunyou-gateway
  labels: { app: yunyou-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yunyou-gateway }
  template:
    metadata:
      labels: { app: yunyou-gateway }
    spec:
      containers:
        - name: yunyou-gateway
          image: yunyou-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: yunyou-middleware }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: yunyou-gateway
spec:
  type: LoadBalancer
  selector: { app: yunyou-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]

# ==================== 用户服务 ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yunyou-user-service
  labels: { app: yunyou-user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yunyou-user-service }
  template:
    metadata:
      labels: { app: yunyou-user-service }
    spec:
      containers:
        - name: yunyou-user-service
          image: yunyou-user-service:1.0.0
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: yunyou-middleware }
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: DB_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: JWT_SECRET } }
            - name: AES_SECRET
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: AES_SECRET } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: yunyou-user-service
spec:
  type: ClusterIP
  selector: { app: yunyou-user-service }
  ports: [{ port: 8081, targetPort: 8081 }]

