# XXL-Job 调度中心（部署到 K8s，走内网 RDS 的 xxl_job 库）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-admin
  labels: { app: xxl-job-admin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: xxl-job-admin }
  template:
    metadata:
      labels: { app: xxl-job-admin }
    spec:
      containers:
        - name: xxl-job-admin
          image: xuxueli/xxl-job-admin:2.4.0
          ports: [{ containerPort: 8080 }]
          env:
            - name: MYSQL_HOST
              value: "rm-bp15ivjv9krm41m7y.mysql.rds.aliyuncs.com"
            - name: MYSQL_PORT
              value: "3306"
            - name: XXLJOB_DB_USERNAME
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: XXLJOB_DB_USERNAME } }
            - name: XXLJOB_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: yunyou-secrets, key: XXLJOB_DB_PASSWORD } }
            - name: PARAMS
              value: "--spring.datasource.url=jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=$(XXLJOB_DB_USERNAME) --spring.datasource.password=$(XXLJOB_DB_PASSWORD) --spring.datasource.hikari.maximum-pool-size=20 --spring.datasource.hikari.max-lifetime=1800000 --server.port=8080"
          readinessProbe: { httpGet: { path: /xxl-job-admin/toLogin, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /xxl-job-admin/toLogin, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: xxl-job-admin
spec:
  type: ClusterIP
  selector: { app: xxl-job-admin }
  ports: [{ port: 8080, targetPort: 8080 }]
