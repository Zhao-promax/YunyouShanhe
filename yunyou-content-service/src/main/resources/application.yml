server:
  port: 8082

spring:
  application:
    name: yunyou-content-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.179.248:8849
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.179.248:3306/content_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  elasticsearch:
    uris: http://192.168.179.248:9200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
