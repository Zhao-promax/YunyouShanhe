server:
  port: 8083

spring:
  application:
    name: yunyou-ticket-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.179.248:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.179.248:3306/ticket_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: 192.168.179.248
      port: 6379
      database: 0
  rabbitmq:
    host: 192.168.179.248
    port: 5672
    username: admin
    password: admin

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

# XXL-Job 执行器
xxl:
  job:
    admin:
      addresses: http://192.168.179.248:8087/xxl-job-admin
    accessToken: default_token
    executor:
      appname: yunyou-ticket-service
      address: ""
      ip: 192.168.179.232
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
