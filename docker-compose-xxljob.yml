# XXL-Job 调度中心（独立部署，存储用阿里云 RDS，不与业务 MySQL 混用）
# 使用前：
#   1) 在 RDS 上创建 xxl_job 库，并执行官方 tables_xxl_job.sql
#   2) 设置数据库密码环境变量：export XXLJOB_DB_PASSWORD=你的密码（或写入 .env 文件）
services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: yunyou-xxl-job-admin
    ports:
      - "8087:8080"
    environment:
      PARAMS: '--spring.datasource.url=jdbc:mysql://rm-bp15ivjv9krm41m7yco.mysql.rds.aliyuncs.com:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=60000 --spring.datasource.username=xxljob_user --spring.datasource.password=${XXLJOB_DB_PASSWORD} --spring.datasource.hikari.maximum-pool-size=20 --spring.datasource.hikari.minimum-idle=5 --spring.datasource.hikari.connection-timeout=30000 --spring.datasource.hikari.idle-timeout=600000 --spring.datasource.hikari.max-lifetime=1800000 --spring.datasource.hikari.validation-timeout=5000 --server.port=8080'
    volumes:
      - xxljob-logs:/data/applogs
    restart: unless-stopped

volumes:
  xxljob-logs:
