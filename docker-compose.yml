# 本地开发依赖中间件
# 说明：若 Docker 运行在虚拟机中，请将下方服务地址改为虚拟机 IP。
# RabbitMQ 上线前需额外启用 rabbitmq_delayed_message_exchange 插件（候补熔断延迟消息）。
# 数据持久化：各中间件使用命名卷，docker compose down / 重启不会丢数据。

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: yunyou-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data

  redis:
    image: redis:7.2
    container_name: yunyou-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: yunyou-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mysql:
    image: mysql:8.0
    container_name: yunyou-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - TZ=Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d

  elasticsearch:
    build: ./es
    container_name: yunyou-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  nacos-data:
  redis-data:
  rabbitmq-data:
  mysql-data:
  es-data:
