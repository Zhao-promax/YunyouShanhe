# 本地开发依赖中间件
# 说明：若 Docker 运行在虚拟机中，请将下方服务地址改为虚拟机 IP。
# RabbitMQ 上线前需额外启用 rabbitmq_delayed_message_exchange 插件（候补熔断延迟消息）。

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: yunyou-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"

  redis:
    image: redis:7.2
    container_name: yunyou-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: yunyou-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"

  mysql:
    image: mysql:8.0
    container_name: yunyou-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - TZ=Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - ./docs/sql:/docker-entrypoint-initdb.d

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: yunyou-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
