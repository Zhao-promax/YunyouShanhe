server:
  port: 8084

spring:
  application:
    name: yunyou-pay-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.179.248:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.179.248:3306/pay_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  rabbitmq:
    host: 192.168.179.248
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  data:
    redis:
      host: 192.168.179.248
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
